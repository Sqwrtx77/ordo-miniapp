<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ORDO TEAM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
  /* ═══ ЦВЕТА (с фото: чёрная ночь, серый капюшон, фиолетовое свечение) ═══ */
  :root {
    --bg: #070609;
    --panel: #18171c;
    --panel-2: #1f1e24;
    --line: rgba(255, 255, 255, .1);
    --text: #eceaf1;
    --gray: #9d9aa7;        /* серая половина заголовков */
    --muted: #85828e;
    --glass: rgba(38, 36, 44, .55);
    --glass-border: rgba(222, 220, 230, .75);
    --chip: rgba(150, 147, 162, .5);
    --violet: #8f3dff;
    --violet-2: #b066ff;
    --glow: #9b4dff;
    --ok: #9ff5c8;
    --safe-top: max(env(safe-area-inset-top), var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.55; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  img { display: block; max-width: 100%; }

  /* ═══ ФОН ═══ */
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .guides { position: fixed; inset: 0; z-index: 3; pointer-events: none; max-width: 520px; margin: 0 auto; }
  .guides::before, .guides::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.16) 0 3px, transparent 3px 7px);
    opacity: .55;
  }
  .guides::before { left: 24.7%; }
  .guides::after { left: 70.1%; }

  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding-bottom: calc(var(--safe-bottom) + 110px); }
  body.sub .app { padding-bottom: calc(var(--safe-bottom) + 30px); }
  [hidden] { display: none !important; }

  /* ═══ НАВИГАЦИЯ — стеклянная панель внизу: Клуб · Внутри · Профиль ═══ */
  .glass {
    background: var(--glass); border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  .bnav {
    position: fixed; z-index: 20; bottom: calc(var(--safe-bottom) + 12px); left: 50%; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 420px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 5px; border-radius: 99px; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
  }
  body.sub .bnav { transform: translate(-50%, 130%); opacity: 0; pointer-events: none; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 99px; font-size: 11px; font-weight: 600; color: #c9c6d2; text-shadow: 0 1px 2px rgba(0,0,0,.4); transition: background .3s, color .3s; }
  .tab svg { width: 20px; height: 20px; transition: color .3s, filter .3s; }
  .tab.active { background: var(--chip); color: #fff; }
  .tab.active svg { color: #d4b3ff; filter: drop-shadow(0 0 6px rgba(176,102,255,.8)); }
  .tab .dot { position: absolute; }
  .back { position: fixed; z-index: 20; top: calc(var(--safe-top) + 12px); left: max(14px, calc(50% - 246px)); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; opacity: 0; pointer-events: none; transform: translateX(-10px); transition: .3s; }
  body.sub .back { opacity: 1; pointer-events: auto; transform: none; }
  .topfade { display: none; }

  /* ═══ ПРОФИЛЬ ═══ */
  .banner.b-prof { background: url(img/bottom.jpg) 60% 100% / auto 150% no-repeat; height: 190px; }
  .banner.b-prof::after { background: linear-gradient(180deg, var(--bg) 0%, rgba(7,6,9,.2) 40%, var(--bg) 100%); }
  .phead { position: relative; display: flex; align-items: center; gap: 12px; margin-top: -54px; }
  .ava { flex: none; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--panel-2); border: 1.5px solid rgba(255,255,255,.28); font-weight: 500; font-size: 18px; color: var(--gray); }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .ava.member { border-color: var(--violet-2); background: #21133a; color: #e6d6ff; box-shadow: 0 0 22px rgba(143,61,255,.55); }
  .phead .nm { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .phead .un { font-size: 12.5px; color: var(--muted); }
  .chip { margin-left: auto; flex: none; font-size: 11.5px; font-weight: 600; padding: 6px 13px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.25); color: var(--gray); }
  .chip.member { border-color: var(--violet-2); color: #e2ccff; box-shadow: 0 0 14px rgba(143,61,255,.35); }

  /* ═══ ПРОПУСК РЕЗИДЕНТА — переворачивается по нажатию ═══ */
  .pass-wrap { margin: 18px 0 4px; perspective: 1300px; }
  .pass-wrap.pop { animation: pop .9s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: scale(.9) rotateX(18deg); opacity: 0; } }
  .pass { position: relative; aspect-ratio: 1.586; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.8,.2,1); cursor: pointer; -webkit-user-select: none; user-select: none; }
  .pass.flipped { transform: rotateY(180deg); }
  .mcard { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; padding: 18px 20px 17px; display: flex; flex-direction: column; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .mcard.bside { transform: rotateY(180deg); }
  .mcard.locked { border: 1.5px dashed rgba(255,255,255,.2); background: rgba(15,14,18,.92); }
  .mcard.locked.front { align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .mcard.locked .num { font-family: Michroma, sans-serif; font-size: 22px; letter-spacing: .1em; color: #3c3945; }
  .mcard.locked p { margin: 0; font-size: 12px; color: var(--muted); }
  .mcard.member { border: 1px solid rgba(176,102,255,.6); background: radial-gradient(120% 95% at 88% 0%, #4a1f8c 0%, #24153d 32%, #18171c 62%, #0d0c10 100%); box-shadow: 0 24px 60px rgba(143,61,255,.28), inset 0 1px 0 rgba(255,255,255,.12); }
  .mcard.member.bside { background: linear-gradient(160deg, #1d1729 0%, #131116 55%, #0d0c10 100%); border-color: rgba(176,102,255,.45); }
  .mcard.member.front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.13) 48%, transparent 60%); transform: translateX(-130%); animation: sheen 5.5s ease-in-out infinite; pointer-events: none; }
  @keyframes sheen { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
  .mcard .wm { position: absolute; right: -10%; bottom: -16%; width: 72%; opacity: .1; pointer-events: none; }
  .mcard .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .mcard .brand { font-family: Michroma, sans-serif; font-size: 11.5px; letter-spacing: .16em; }
  .mcard .flipico { color: rgba(255,255,255,.45); display: grid; }
  .ptitle { position: relative; margin-top: 12px; font-size: 23px; font-weight: 300; line-height: 1.02; letter-spacing: -.01em; }
  .ptitle .g { display: block; color: #aaa4b8; }
  .ptitle .w { display: block; font-weight: 400; background: linear-gradient(95deg, #ffffff 0%, #e6d4ff 45%, #b27bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(176,102,255,.35)); }
  .mcard.locked .ptitle { margin-top: 0; font-size: 17px; }
  .mcard.locked .ptitle .w { background: none; color: #6f6a7b; filter: none; }
  .mcard .no { position: relative; margin-top: auto; font-family: Michroma, sans-serif; font-size: 30px; letter-spacing: .04em; line-height: 1; text-shadow: 0 0 22px rgba(176,102,255,.55); }
  .mcard .bot { position: relative; display: flex; justify-content: space-between; margin-top: 9px; font-size: 11.5px; color: #bdb8c9; }
  .mcard .stripe { position: absolute; left: 0; right: 0; top: 18px; height: 30px; background: linear-gradient(90deg, #040306, #1b1426 50%, #040306); }
  .mcard .bgrid { position: relative; margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; }
  .mcard .bgrid .k { display: block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #7f7a8c; }
  .mcard .bgrid .v { display: block; font-size: 12.5px; color: #ece9f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard .bfoot { position: relative; margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .mcard .bfoot small { font-size: 10px; color: #7f7a8c; text-align: right; line-height: 1.35; }
  .mcard .gives { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
  .mcard .gives li { display: grid; grid-template-columns: 30px 1fr; font-size: 13px; color: #dcd9e3; }
  .mcard .gives b { font-family: Michroma, sans-serif; font-size: 11px; font-weight: 400; color: var(--violet-2); padding-top: 2px; }
  .flip-hint { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 2px; font-size: 11.5px; color: var(--muted); }
  .okdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); margin-right: 7px; vertical-align: 1px; }
  .kv a { color: #d4b3ff; text-decoration: none; }

  .demo-sw { position: fixed; z-index: 40; top: calc(var(--safe-top) + 12px); right: 12px; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 99px; border: 1px dashed rgba(255,255,255,.4); background: rgba(7,6,9,.75); color: #ffcf96; }

  /* ═══ ЭКРАНЫ ═══ */
  .screen { display: none; }
  .screen.active { display: block; animation: enter .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; } }
  /* появление при прокрутке: класс .in ставит наблюдатель, когда блок попал на экран */
  .reveal { opacity: 0; transform: translateY(16px); }
  .reveal.in { animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .pad { padding: 0 20px; }

  /* ═══ ТИПОГРАФИКА ═══ */
  .duo { margin: 0; font-weight: 300; letter-spacing: -.01em; line-height: 1.05; }
  .duo .g { color: var(--gray); display: block; }
  .duo .w { color: var(--text); display: block; font-weight: 400; }
  .caps { text-transform: uppercase; letter-spacing: .01em; }
  .vline { width: 72px; height: 2px; background: var(--violet); box-shadow: 0 0 10px rgba(143,61,255,.8); margin: 16px 0; }
  .cap::first-letter { font-size: 2.15em; font-weight: 500; line-height: .8; }
  .small { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .label { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .wide { font-family: Michroma, sans-serif; }

  /* ═══ HERO ═══ */
  .hero { position: relative; overflow: hidden; }
  .hero img { width: 118%; max-width: none; margin-left: -9%; height: auto; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none; }
  .hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12%; background: linear-gradient(180deg, var(--bg), transparent); z-index: 1; pointer-events: none; }
  .orb {
    position: absolute; z-index: 2; left: 50%; top: 64.3%; transform: translate(-50%, -50%);
    width: 78px; height: 78px; border-radius: 50%; background: #fff; color: #111;
    box-shadow: 0 0 0 13px rgba(255,255,255,.28), 0 0 0 28px rgba(255,255,255,.12), 0 0 50px rgba(190,140,255,.55);
    display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.05;
    transition: transform .2s; animation: breathe 3.5s ease-in-out infinite;
  }
  .orb:active { transform: translate(-50%, -50%) scale(.93); }
  .orb small { display: block; font-size: 9.5px; font-weight: 600; opacity: .55; margin-top: 3px; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 15px rgba(255,255,255,.24), 0 0 0 32px rgba(255,255,255,.09), 0 0 70px rgba(190,140,255,.7); } }
  .scroll { position: absolute; z-index: 2; right: 14px; top: 62%; font-size: 10.5px; font-weight: 600; text-align: center; }
  .scroll svg { display: block; margin: 0 auto 3px; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }

  /* ═══ КТО МЫ ═══ */
  .who { margin-top: 6px; display: grid; gap: 22px; }
  .who h2 { font-size: 34px; }
  .who p { margin: 0; font-size: 14.5px; color: #dcd9e3; line-height: 1.7; }
  .together h3 { font-size: 26px; margin-bottom: 14px; }

  /* ═══ КНОПКИ ═══ */
  .outline-btn { display: inline-flex; align-items: stretch; height: 38px; border: 1.5px solid #fff; border-radius: 99px; overflow: hidden; transition: transform .15s; }
  .outline-btn:active { transform: scale(.97); }
  .outline-btn .t { display: flex; align-items: center; padding: 0 18px; font-size: 12.5px; font-weight: 600; }
  .outline-btn .a { display: grid; place-items: center; width: 44px; border-left: 1.5px solid #fff; border-radius: 99px; }
  .white-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 22px; border-radius: 99px; background: #fff; color: #111; font-weight: 700; font-size: 15px; height: 58px; box-shadow: 0 0 34px rgba(190,140,255,.35); transition: transform .15s; }
  .white-btn .a { width: 46px; height: 46px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; }
  .white-btn:active, .ghost-btn:active { transform: scale(.98); }
  .ghost-btn { width: 100%; height: 54px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.75); font-weight: 600; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s; }
  [disabled] { opacity: .55; pointer-events: none; }

  /* ═══ КАРТОЧКА 01 ═══ */
  .card01 { position: relative; margin-top: 46px; display: grid; grid-template-columns: 1fr 46%; min-height: 300px; }
  .card01::before { content: ""; position: absolute; top: 0; bottom: 0; left: 24.7%; right: 46%; background: var(--panel); }
  .card01 .txt { position: relative; padding: 26px 14px 22px 20px; display: flex; flex-direction: column; }
  .card01 h3 { font-size: 21px; line-height: 1.12; }
  .card01 .txt p { margin: 0 0 0 calc(24.7vw - 20px); max-width: 160px; }
  .card01 .num { margin-top: auto; padding-top: 18px; font-weight: 700; font-size: 15px; }
  .card01 .pic { position: relative; background: url(img/card.jpg) center / cover; }

  /* ═══ ФИНАЛ ═══ */
  .finale { position: relative; margin-top: 50px; min-height: 280px; background: url(img/bottom.jpg) 64% 100% / auto 100% no-repeat; display: flex; flex-direction: column; justify-content: center; }
  .finale::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,6,9,.85) 0%, rgba(7,6,9,.35) 50%, transparent 75%), linear-gradient(180deg, var(--bg), transparent 30%); }
  .finale > * { position: relative; }
  .finale .brand { font-size: 26px; letter-spacing: .02em; }
  .finale .brand b { font-size: 1.22em; font-weight: 400; }
  .finale .slogan { font-size: 32px; font-weight: 300; line-height: 1.1; }

  /* ═══ БАННЕРЫ ДРУГИХ ЭКРАНОВ ═══ */
  .banner { position: relative; height: 250px; background: url(img/hero.jpg) 50% 70% / 175% auto no-repeat; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg) 0%, transparent 35%, transparent 60%, var(--bg) 100%); }
  .banner.b-join::after { background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 30%, transparent 52%, transparent 70%, var(--bg) 100%); }
  .banner.b-card { background: url(img/inside.jpg) 50% 50% / cover no-repeat; height: 230px; }
  .banner.b-done { background: url(img/bottom.jpg) 60% 100% / auto 150% no-repeat; height: 280px; }
  .banner.b-done::after { background: linear-gradient(180deg, var(--bg) 0%, transparent 28%, transparent 88%, var(--bg) 100%); }
  .price-orb {
    position: absolute; z-index: 1; left: 50%; top: 58%; transform: translate(-50%, -50%);
    width: 104px; height: 104px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; text-align: center;
    box-shadow: 0 0 0 14px rgba(255,255,255,.26), 0 0 0 30px rgba(255,255,255,.1), 0 0 70px rgba(190,140,255,.6);
  }
  .price-orb b { display: block; font-family: Michroma, sans-serif; font-size: 30px; font-weight: 400; line-height: 1; }
  .price-orb small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; margin-top: 6px; }
  .done-logo { position: absolute; z-index: 1; left: 50%; top: 34%; transform: translate(-50%, -50%); width: 62%; filter: drop-shadow(0 0 18px rgba(176,102,255,.6)); }

  /* ═══ ВНУТРИ ═══ */
  .rows { margin-top: 14px; border-top: 1px solid var(--line); }
  .row-i { display: grid; grid-template-columns: 46px 1fr; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .row-i .n { font-weight: 700; font-size: 14px; padding-top: 3px; }
  .row-i b { display: block; font-weight: 300; font-size: 19px; text-transform: uppercase; margin-bottom: 4px; }
  .row-i span { color: var(--muted); font-size: 13px; }
  .faq { display: grid; gap: 10px; margin-top: 14px; }
  .faq details { border: 1.5px solid rgba(255,255,255,.18); border-radius: 26px; padding: 0 20px; background: rgba(255,255,255,.02); }
  .faq summary { list-style: none; cursor: pointer; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 500; font-size: 14px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "↗"; font-size: 14px; transition: transform .3s; color: var(--gray); }
  .faq details[open] summary::after { transform: rotate(90deg); }
  .faq p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  /* ═══ ВСТУПИТЬ ═══ */
  .code { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; margin: 22px 0 14px; background: var(--panel); border-left: 2px solid var(--violet); }
  .code .v { font-family: Michroma, sans-serif; font-size: 15px; letter-spacing: .06em; margin-top: 4px; word-break: break-all; }
  .copy { flex: none; height: 32px; padding: 0 14px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.7); font-size: 12px; font-weight: 600; }
  .copy.done { border-color: var(--ok); color: var(--ok); }
  .stack { display: grid; gap: 10px; }
  .status { min-height: 20px; margin-top: 12px; text-align: center; font-size: 13px; color: var(--muted); }
  .status.warn { color: #ffcf96; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .manual { margin-top: 18px; background: var(--panel); padding: 0 18px; }
  .manual summary { list-style: none; cursor: pointer; padding: 15px 0; font-size: 13.5px; font-weight: 600; color: var(--gray); display: flex; justify-content: space-between; }
  .manual summary::-webkit-details-marker { display: none; }
  .manual summary::after { content: "↓"; transition: transform .3s; }
  .manual[open] summary::after { transform: rotate(180deg); }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .kv .k { color: var(--muted); flex: none; }
  .kv .v { font-family: ui-monospace, monospace; font-size: 11.5px; text-align: right; word-break: break-all; }
  .kv:last-child { padding-bottom: 15px; }

  /* ═══ ГЛАВНАЯ: плашка-отсчёт до старта ═══ */
  /* плашка во всю ширину над картинкой — не перекрывает фигуру */
  .cd { position: relative; z-index: 3; margin: calc(var(--safe-top) + 14px) 16px 4px; padding: 12px 18px 10px; border-radius: 18px; border-width: 1px; border-color: rgba(176,102,255,.55); box-shadow: 0 6px 24px rgba(0,0,0,.45), 0 0 26px rgba(143,61,255,.22); display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; }
  .cd .cd-top { grid-column: 1; grid-row: 1 / span 2; }
  .cd .cd-num { grid-column: 2; grid-row: 1; margin-top: 0; justify-content: flex-end; }
  .cd .cd-num span:last-child { margin-right: 0; }
  .cd .cd-date { grid-column: 2; grid-row: 2; text-align: right; margin-top: 1px; }
  .cd-top { display: flex; align-items: center; font-size: 9.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #cbb7ec; }
  .cd-top .okdot { width: 6px; height: 6px; margin-right: 7px; background: var(--violet-2); box-shadow: 0 0 8px var(--violet-2); animation: breathe-dot 2s ease-in-out infinite; }
  @keyframes breathe-dot { 50% { opacity: .35; } }
  .cd-num { margin-top: 4px; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .cd-num b { font-family: Michroma, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1; text-shadow: 0 0 14px rgba(176,102,255,.6); }
  .cd-num span { font-size: 11.5px; color: var(--gray); margin-right: 6px; }
  .cd-date { margin-top: 2px; text-align: right; font-size: 10.5px; color: var(--muted); }

  /* ═══ ГЛАВНАЯ: плавный переход к «Что внутри» ═══ */
  .scroll { cursor: pointer; }
  .dive { position: relative; margin-top: 10px; }
  .dive .banner.b-card { height: 300px; }
  .dive .banner.b-card::after { background: linear-gradient(180deg, var(--bg) 0%, rgba(7,6,9,.55) 30%, transparent 55%, var(--bg) 100%); }
  .dive .banner .lbl { position: absolute; z-index: 1; left: 20px; top: 70px; }

  /* ═══ КАБИНЕТ: мини-карточка результата ═══ */
  .rescard { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; background: var(--panel); border-left: 2px solid var(--violet); cursor: pointer; }
  .rescard .v { font-family: Michroma, sans-serif; font-size: 17px; margin-top: 3px; }
  .rescard .arr { color: var(--gray); }

  /* ═══ АНАЛИЗ ═══ */
  :root { --up: #3ddc97; --down: #b9a7d6; }  /* минус — спокойный сиреневый, а не красный */
  .up { color: var(--up); } .down { color: var(--down); }
  .st-head { padding-top: calc(var(--safe-top) + 34px); }
  .curbar { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .curs { display: flex; padding: 3px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.16); }
  .curs button { height: 28px; min-width: 48px; padding: 0 12px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--gray); }
  .curs button.on { background: var(--violet); color: #fff; box-shadow: 0 0 14px rgba(143,61,255,.55); }
  .seg { display: flex; gap: 6px; margin: 20px 0 14px; }
  .seg button { flex: 1; height: 34px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.16); font-size: 12px; font-weight: 600; color: var(--gray); transition: .25s; }
  .seg button.on { background: #fff; color: #111; border-color: #fff; }
  .pnl-main { position: relative; overflow: hidden; padding: 18px 18px 16px; background: radial-gradient(110% 120% at 100% 0%, rgba(143,61,255,.22), transparent 55%), var(--panel); border: 1px solid rgba(255,255,255,.07); border-radius: 22px; }
  .pnl-main .big { font-family: Michroma, sans-serif; font-size: 30px; line-height: 1.1; margin-top: 8px; letter-spacing: -.01em; }
  .pnl-main .big small { font-family: Inter, sans-serif; font-size: 13px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .pnl-main .sub { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgba(61,220,151,.13); }
  .pill.down { background: rgba(185,167,214,.13); }
  .eq { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
  .eq .k, .tile .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .eq .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .chart { position: relative; margin-top: 14px; height: 170px; touch-action: pan-y; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .tip { position: absolute; top: 0; transform: translateX(-50%); padding: 4px 9px; border-radius: 9px; background: #26242c; border: 1px solid rgba(255,255,255,.18); font-size: 11.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .chart .tip.on { opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 6px; }
  .bars { margin-top: 10px; height: 70px; }
  .bars svg { width: 100%; height: 100%; display: block; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .tile { padding: 14px 15px; background: var(--panel); border-radius: 16px; }
  .tile .v { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .tile .s { font-size: 11.5px; color: var(--muted); }
  .hist { margin-top: 10px; }
  .hist .kv .v { font-family: Inter, sans-serif; font-size: 13.5px; font-weight: 600; }
  .more { width: 100%; margin-top: 8px; height: 40px; font-size: 12.5px; font-weight: 600; color: var(--gray); }
  .st-note { margin-top: 16px; font-size: 11.5px; color: var(--muted); text-align: center; }
  /* заглушка «Анализа»: красивый график-стрелка вверх (гость или нет данных) */
  .teaser { position: relative; margin-top: 22px; padding: 18px 10px 6px; border-radius: 24px; overflow: hidden; background: radial-gradient(90% 80% at 85% 10%, rgba(143,61,255,.28), transparent 60%), radial-gradient(70% 60% at 10% 100%, rgba(143,61,255,.12), transparent 70%), var(--panel); border: 1px solid rgba(176,102,255,.22); }
  .teaser svg { display: block; width: 100%; height: auto; overflow: visible; }
  .teaser .grid line { stroke: rgba(255,255,255,.07); stroke-dasharray: 4 10; }
  .teaser .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.6,.05,.25,1) .15s forwards; }
  .teaser .ar { opacity: 0; animation: fadein .5s ease 1.75s forwards; }
  .teaser .ar2 { opacity: 0; animation: fadein .9s ease 1.5s forwards; }
  .teaser .tipdot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: fadein .4s ease 1.9s forwards, tpulse 2.4s ease-in-out 2.3s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes tpulse { 50% { transform: scale(1.6); opacity: .35; } }
  .teaser-txt { text-align: center; margin-top: 22px; }
  .teaser-txt h3 { margin: 10px 0 6px; font-weight: 400; font-size: 22px; }
  .teaser-txt p { margin: 0 auto 18px; max-width: 290px; font-size: 13px; color: var(--muted); }
  .teaser-txt .white-btn { max-width: 320px; margin: 0 auto; }
  .lockwrap { position: relative; }
  .lockwrap .blur { max-height: 470px; overflow: hidden; filter: blur(7px) saturate(.6); opacity: .55; pointer-events: none; -webkit-user-select: none; user-select: none; -webkit-mask: linear-gradient(180deg, #000 70%, transparent); mask: linear-gradient(180deg, #000 70%, transparent); }
  .lockwrap .over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 24px; }
  .lockwrap .over h3 { margin: 0; font-weight: 400; font-size: 22px; }
  .lockwrap .over p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .empty { margin-top: 26px; padding: 34px 22px; text-align: center; border: 1.5px dashed rgba(255,255,255,.16); border-radius: 22px; color: var(--muted); font-size: 13.5px; }
  .empty b { display: block; color: var(--text); font-weight: 500; font-size: 16px; margin-bottom: 6px; }

  /* ═══ ПАНЕЛЬ УПРАВЛЕНИЯ ═══ */
  .adm { margin-top: 38px; }
  .adm-head { display: flex; align-items: center; justify-content: space-between; }
  .adm-hint { margin-top: 12px; padding: 15px 18px; background: var(--panel); border-left: 2px solid var(--violet); font-size: 13px; color: #cfcbd8; }
  .viewas { display: flex; gap: 6px; margin: 14px 0 4px; align-items: center; font-size: 12px; color: var(--muted); }
  .viewas button { height: 30px; padding: 0 12px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.16); font-size: 11.5px; font-weight: 600; color: var(--gray); }
  .viewas button.on { border-color: var(--violet-2); color: #e2ccff; }
  .search { width: 100%; height: 44px; margin-top: 12px; padding: 0 18px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.03); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .search:focus, .fld:focus { border-color: var(--violet-2); }
  .ulist { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  #s-admin .st-head { padding-top: calc(var(--safe-top) + 72px); }
  .urow { background: var(--panel); border-radius: 18px; overflow: hidden; border: 1px solid transparent; transition: border-color .25s; }
  .urow.open { border-color: rgba(176,102,255,.45); }
  .urow .uh { width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 14px; text-align: left; }
  .urow .ua, .qrow .ua { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1.5px solid rgba(255,255,255,.2); color: var(--gray); font-weight: 600; }
  .urow .ua.member, .qrow .ua.member { border-color: var(--violet-2); color: #e6d6ff; background: #21133a; }
  .urow .ut { flex: 1; min-width: 0; }
  .urow .ut b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urow .ut span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urow .ur { flex: none; text-align: right; font-size: 12px; font-weight: 600; }
  .urow .ur small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .badge { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; margin-left: 5px; vertical-align: 1px; background: rgba(176,102,255,.2); color: #d9bfff; }
  .urow .ut b .badge { display: inline-block; font-size: 9.5px; color: #d9bfff; }
  .urow .ut b .badge.ch { color: #ffcf96; }
  .badge.ch { background: rgba(255,207,150,.18); color: #ffcf96; }
  .ub { padding: 4px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); }
  .ub .line2 > * { min-width: 0; }
  .fld[type="date"] { width: 100%; }
  .ub .sec { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .line2 { display: flex; gap: 8px; align-items: center; }
  .fld { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.16); background: #121116; color: var(--text); font: inherit; font-size: 14px; outline: none; color-scheme: dark; }
  .sbtn { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.55); font-size: 12.5px; font-weight: 600; }
  .sbtn.up { border-color: rgba(61,220,151,.6); color: var(--up); }
  .sbtn.down { border-color: rgba(255,92,122,.6); color: var(--down); }
  .sbtn.danger { border-color: rgba(255,92,122,.6); color: var(--down); width: 100%; }
  .sbtn.okb { border-color: var(--violet-2); color: #e2ccff; width: 100%; }
  .ent { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .ent:first-child { border-top: 0; }
  .ents { max-height: 340px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ent .x { flex: none; }
  .ent-ed .line2 > * { min-width: 0; }
  .ent-ed .fld { width: 100%; }
  .ent-ed .sign { flex: none; }
  .ent-ed .sbtn { flex: none; padding: 0 12px; }
  .ent-ed .line2 .sbtn[data-ecancel], .ent-ed .line2 .sbtn.danger { flex: 1; width: auto; }
  .ent-ed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px; margin: 6px 0; border-radius: 14px; background: #121116; border: 1px solid rgba(176,102,255,.45); }
  .ent .x { width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 16px; }
  .savebar { position: fixed; z-index: 25; left: 50%; transform: translate(-50%, 140%); bottom: calc(var(--safe-bottom) + 84px); width: calc(100% - 28px); max-width: 420px; display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 18px; border-radius: 99px; background: #fff; color: #111; box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 30px rgba(190,140,255,.35); opacity: 0; pointer-events: none; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s; }
  body.sub .savebar { bottom: calc(var(--safe-bottom) + 16px); }
  body.sub .app { padding-bottom: calc(var(--safe-bottom) + 100px); }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; background: var(--panel); border-radius: 16px; }
  .qrow .ut { flex: 1; min-width: 0; }
  .qrow .ut b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow .ut span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow.filled { box-shadow: inset 0 0 0 1px rgba(176,102,255,.45); }
  .sign { flex: none; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; font-weight: 600; line-height: 1; border: 1.5px solid rgba(61,220,151,.6); color: var(--up); }
  .sign.neg { border-color: rgba(255,92,122,.6); color: var(--down); }
  .qin { flex: none; width: 96px; text-align: right; font-size: 16px; font-weight: 600; }
  .days { display: flex; gap: 6px; margin: 10px 0 4px; }
  .days button, .days label { flex: 1; height: 38px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.16); font-size: 12px; font-weight: 600; color: var(--gray); display: grid; place-items: center; position: relative; overflow: hidden; cursor: pointer; }
  .days .on { background: #fff; color: #111; border-color: #fff; }
  .days input { position: absolute; inset: 0; opacity: 0; color-scheme: dark; }
  .admtabs { display: flex; gap: 6px; margin: 18px 0 6px; }
  .admtabs button { flex: 1; height: 40px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.16); font-size: 12.5px; font-weight: 600; color: var(--gray); }
  .admtabs button.on { border-color: var(--violet-2); color: #fff; background: rgba(143,61,255,.22); }
  .savebar.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .savebar .t { flex: 1; font-size: 13px; font-weight: 600; }
  .savebar .c { height: 40px; padding: 0 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: #555; }
  .savebar .s { height: 40px; padding: 0 18px; border-radius: 99px; background: #111; color: #fff; font-size: 13px; font-weight: 700; }

  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(var(--safe-bottom) + 150px); transform: translate(-50%, 16px); background: #1f1e24; border: 1.5px solid rgba(255,255,255,.4); padding: 9px 18px; border-radius: 99px; font-size: 13px; opacity: 0; pointer-events: none; transition: .3s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="guides"></div>
<div class="topfade"></div>
<div class="toast" id="toast"></div>

<nav class="bnav glass">
  <button class="tab active" data-go="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
    Главная
  </button>
  <button class="tab" data-go="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
    Кабинет
  </button>
  <button class="tab" data-go="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M5 15l4.5-4.5 3.5 3.5L19.5 7"/><path d="M15 7h4.5v4.5"/></svg>
    Доходность
  </button>
</nav>
<button class="back glass" id="backBtn" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="demo-sw" id="demoSw" hidden></button>

<main class="app">

  <!-- ═══ ЭКРАН 1: КЛУБ ═══ -->
  <section class="screen active" id="s-home">
    <div class="cd glass" id="countdown">
      <div class="cd-top"><span class="okdot"></span><span id="cdLabel"></span></div>
      <div class="cd-num" id="cdNum"></div>
      <div class="cd-date" id="cdDate"></div>
    </div>
    <div class="hero">
      <img src="img/hero.jpg" alt="ORDO TEAM">
      <button class="orb" id="orbBtn"><span id="orbLabel"></span></button>
      <button class="scroll" id="scrollBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
        Листай вниз
      </button>
    </div>

    <div class="pad who">
      <h2 class="duo reveal"><span class="g" data-t="whoA"></span><span class="w" data-t="whoB"></span></h2>
      <p class="cap reveal" style="animation-delay:.08s" data-t="whoText"></p>
      <div class="together reveal" style="animation-delay:.16s">
        <h3 class="duo"><span class="w" style="font-weight:300" data-t="togetherA"></span><span class="w" style="font-weight:300" data-t="togetherB"></span></h3>
        <button class="outline-btn" data-go="join"><span class="t" data-t="togetherBtn"></span><span class="a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span></button>
      </div>
    </div>


    <!-- бывшая вкладка «Внутри» — теперь продолжение Главной при прокрутке -->
    <div class="dive" id="inside">
      <div class="banner b-card reveal"></div>
      <div class="pad">
        <h2 class="duo reveal" style="font-size:34px; margin-top:-20px; position:relative"><span class="g" data-t="insideA"></span><span class="w" data-t="insideB"></span></h2>
        <div class="vline reveal" style="animation-delay:.05s"></div>
        <p class="small reveal" style="animation-delay:.08s; margin:0" data-t="insideLead"></p>
        <div class="rows" id="features"></div>
        <div class="label reveal" style="margin-top:34px">Вопросы</div>
        <div class="faq reveal" style="animation-delay:.05s" id="faq"></div>
        <div class="reveal" style="margin-top:26px"><button class="white-btn" id="homeCta"><span id="homeCtaT"></span><span class="a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span></button></div>
      </div>
    </div>
  </section>

  <!-- ═══ ЭКРАН: ПАНЕЛЬ УПРАВЛЕНИЯ (админ и модераторы, отдельная страница со стрелкой назад) ═══ -->
  <section class="screen" id="s-admin"><div class="pad st-head" id="admBox"></div></section>

  <!-- ═══ ЭКРАН: АНАЛИЗ (статистика резидента) ═══ -->
  <section class="screen" id="s-stats">
    <div class="pad st-head">
      <h2 class="duo reveal" style="font-size:34px"><span class="g" id="stHA"></span><span class="w" id="stHB"></span></h2>
      <div class="vline reveal" style="animation-delay:.05s"></div>
      <p class="small reveal" style="animation-delay:.08s; margin:0" data-t="statsLead"></p>
      <div class="reveal" style="animation-delay:.12s" id="stBody"></div>
    </div>
  </section>

  <!-- ═══ ЭКРАН 3: ВСТУПИТЬ ═══ -->
  <section class="screen" id="s-join">
    <div class="banner b-join">
      <div class="price-orb"><div><b id="priceVal"></b><small>USDT</small></div></div>
    </div>
    <div class="pad">
      <h2 class="duo reveal" style="font-size:32px"><span class="g" data-t="joinA"></span><span class="w" data-t="joinB"></span></h2>
      <div class="vline reveal" style="animation-delay:.05s"></div>
      <p class="small reveal" style="animation-delay:.08s; margin:0" data-t="priceNote"></p>
      <div class="rows" id="steps"></div>

      <div class="code reveal" style="animation-delay:.36s">
        <div><div class="label">Код для комментария</div><div class="v" id="codeVal"></div></div>
        <button class="copy" data-copy="code">Копировать</button>

  const lbl = () => { sw.textContent = "Демо: " + (S.paid ? "участник" : "гость") + " ⇄"; };
  sw.hidden = false; lbl();
  sw.addEventListener("click", () => { S.paid = !S.paid; demoTries = 0; S.paid ? applyPaidUi() : resetPaidUi(); renderProfile(S.paid); lbl(); if (current === "join" && S.paid) go("profile"); });}

/* ── копирование ── */
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 1800); }
document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
  const val = b.dataset.copy === "code" ? S.code : S.wallet;
  try { await navigator.clipboard.writeText(val); } catch (e) { const ta = document.createElement("textarea"); ta.value = val; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  haptic("medium"); toast("Скопировано");
  const old = b.textContent; b.textContent = "✓"; b.classList.add("done"); setTimeout(() => { b.textContent = old; b.classList.remove("done"); }, 1500);
}));

/* ── оплата ── */
$("#payBtn").addEventListener("click", () => {
  haptic("medium");
  const link = `https://app.tonkeeper.com/transfer/${S.wallet}?jetton=${USDT_MASTER}&amount=${PRICE_UNITS}&text=${encodeURIComponent(S.code)}`;
  if (DEMO) toast("Демо: здесь откроется Tonkeeper"); else if (tg) tg.openLink(link); else window.open(link, "_blank");
  startAutoCheck();
});
function toRaw(a) {
  if (a.includes(":")) return a.toLowerCase();
  const b = atob(a.replace(/-/g, "+").replace(/_/g, "/"));
  const wc = b.charCodeAt(1) > 127 ? b.charCodeAt(1) - 256 : b.charCodeAt(1);
  let hex = ""; for (let i = 2; i < 34; i++) hex += b.charCodeAt(i).toString(16).padStart(2, "0");
  return `${wc}:${hex}`;
}
let demoTries = 0, checking = false, autoTimer = null;
async function isPaid() {
  if (DEMO) { await new Promise((r) => setTimeout(r, 1500)); return demoTries++ >= 1; }
  const wRaw = toRaw(S.wallet);
  const r = await fetch(`https://tonapi.io/v2/accounts/${S.wallet}/events?limit=50`);
  if (!r.ok) throw new Error("tonapi " + r.status);
  const { events = [] } = await r.json();
  return events.some((ev) => !ev.in_progress && (ev.actions || []).some((a) => {
    const jt = a.JettonTransfer;
    return a.type === "JettonTransfer" && a.status === "ok" && jt &&
      (jt.jetton?.address || "").toLowerCase() === USDT_MASTER_RAW &&
      (jt.recipient?.address || "").toLowerCase() === wRaw &&
      (jt.comment || "").trim().toUpperCase() === S.code.toUpperCase() &&
      Number(jt.amount) >= PRICE_UNITS;
  }));
}
async function check(manual) {
  if (checking) return; checking = true;
  const btn = $("#checkBtn"), st = $("#payStatus");
  if (manual) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Проверяю…'; st.className = "status"; st.textContent = ""; }
  try {
    if (await isPaid()) { markPaid(); return; }
    if (manual) { st.className = "status warn"; st.textContent = `Ждём перевод — обычно он доходит за полминуты. Проверь, что указан код ${S.code}.`; }
  } catch (e) { if (manual) { st.className = "status warn"; st.textContent = "Сеть немного задумалась — нажми ещё раз через минуту."; } }
  finally { checking = false; btn.disabled = false; btn.textContent = "Я оплатил — проверить"; }
}
$("#checkBtn").addEventListener("click", () => { haptic(); check(true); });
function startAutoCheck() {
  if (autoTimer) return;
  $("#payStatus").className = "status"; $("#payStatus").textContent = "Ждём перевод — проверяем сами каждые 10 секунд…";
  autoTimer = setInterval(() => check(false), 10000);
}
function markPaid() {
  S.paid = true; clearInterval(autoTimer);
  try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  applyPaidUi(); renderProfile(true); go("profile"); toast(TEXTS.paidToast);
  const sw = $("#demoSw"); if (!sw.hidden) sw.textContent = "Демо: участник ⇄";
}
function applyPaidUi() { $("#orbLabel").innerHTML = "Мой<br>пропуск"; $("#homeCtaT").textContent = "Мой пропуск"; if (current === "stats") renderStats(); }
function resetPaidUi() { $("#orbLabel").innerHTML = `${TEXTS.orbLabel}<small>${S.price} USDT</small>`; $("#homeCtaT").textContent = TEXTS.joinCta; if (current === "stats") renderStats(); }
S.paid ? applyPaidUi() : resetPaidUi();
revealIn("#s-home");
</script>
</body>
</html>
